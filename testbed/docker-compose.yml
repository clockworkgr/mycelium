## Mycelium mesh testbed - basic topology
## Use with: docker compose -f testbed/docker-compose.yml up
##
## Default: 5-node linear chain (node1 <-> node2 <-> node3 <-> node4 <-> node5)
## See testbed/scenarios/ for more topologies.

services:
  node1:
    build:
      context: ..
      dockerfile: testbed/Dockerfile
    container_name: mycelium-node1
    hostname: node1
    environment:
      - MYCELIUM_DISPLAY_NAME=node1
      - RUST_LOG=info
    networks:
      link12:
        ipv4_address: 10.0.12.1
    volumes:
      - node1-data:/data/mycelium
    cap_add:
      - NET_ADMIN

  node2:
    build:
      context: ..
      dockerfile: testbed/Dockerfile
    container_name: mycelium-node2
    hostname: node2
    environment:
      - MYCELIUM_DISPLAY_NAME=node2
      - RUST_LOG=info
    networks:
      link12:
        ipv4_address: 10.0.12.2
      link23:
        ipv4_address: 10.0.23.2
    volumes:
      - node2-data:/data/mycelium
    cap_add:
      - NET_ADMIN

  node3:
    build:
      context: ..
      dockerfile: testbed/Dockerfile
    container_name: mycelium-node3
    hostname: node3
    environment:
      - MYCELIUM_DISPLAY_NAME=node3
      - RUST_LOG=info
    networks:
      link23:
        ipv4_address: 10.0.23.3
      link34:
        ipv4_address: 10.0.34.3
    volumes:
      - node3-data:/data/mycelium
    cap_add:
      - NET_ADMIN

  node4:
    build:
      context: ..
      dockerfile: testbed/Dockerfile
    container_name: mycelium-node4
    hostname: node4
    environment:
      - MYCELIUM_DISPLAY_NAME=node4
      - RUST_LOG=info
    networks:
      link34:
        ipv4_address: 10.0.34.4
      link45:
        ipv4_address: 10.0.45.4
    volumes:
      - node4-data:/data/mycelium
    cap_add:
      - NET_ADMIN

  node5:
    build:
      context: ..
      dockerfile: testbed/Dockerfile
    container_name: mycelium-node5
    hostname: node5
    environment:
      - MYCELIUM_DISPLAY_NAME=node5
      - RUST_LOG=info
    networks:
      link45:
        ipv4_address: 10.0.45.5
    volumes:
      - node5-data:/data/mycelium
    cap_add:
      - NET_ADMIN

networks:
  link12:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.12.0/24
  link23:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.23.0/24
  link34:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.34.0/24
  link45:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.45.0/24

volumes:
  node1-data:
  node2-data:
  node3-data:
  node4-data:
  node5-data:
