name: MyceliumBindings
description: Auto-generated FFI bindings for Mycelium native library
output: 'lib/src/ffi/mycelium_bindings_generated.dart'
headers:
  entry-points:
    - '../crates/mycelium-ffi/include/mycelium.h'
  include-directives:
    - '../crates/mycelium-ffi/include/mycelium.h'

# macOS: uses CommandLineTools SDK path. Override via CPATH if needed:
#   export CPATH="$(xcrun --show-sdk-path)/usr/include"
# Linux: no compiler-opts needed (system headers are in default paths)
compiler-opts:
  - '-I/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk/usr/include'

preamble: |
  // AUTO-GENERATED by ffigen — do not edit manually.
  // Regenerate with: cd flutter && dart run ffigen --config ffigen.yaml
