[workspace]
resolver = "2"
members = [
    "crates/mycelium-protocol",
    "crates/mycelium-crypto",
    "crates/mycelium-core",
    "crates/mycelium-storage",
    "crates/mycelium-node",
    "crates/mycelium-api",
    "crates/mycelium-ffi",
    "crates/mycelium-meshtastic",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.75"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Crypto
ed25519-dalek = { version = "2", features = ["rand_core", "serde"] }
x25519-dalek = { version = "2", features = ["static_secrets", "serde"] }
hkdf = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
rand = "0.8"
curve25519-dalek = { version = "4", features = ["serde"] }

# Storage
rusqlite = { version = "0.31", features = ["bundled-sqlcipher-vendored-openssl"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-android = "0.2"

# Error handling
thiserror = "2"
anyhow = "1"

# Config
toml = "0.8"

# Testing
proptest = "1"

# Internal crates
mycelium-protocol = { path = "crates/mycelium-protocol" }
mycelium-crypto = { path = "crates/mycelium-crypto" }
mycelium-core = { path = "crates/mycelium-core" }
mycelium-storage = { path = "crates/mycelium-storage" }
mycelium-node = { path = "crates/mycelium-node" }
mycelium-api = { path = "crates/mycelium-api" }
